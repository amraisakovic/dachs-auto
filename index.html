<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dach's Automotive</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- HEADER (Navbar) -->
    <header id="navbar">
        <div class="logo-container">
            <img src="./dachs-auto/assets/Dachs logo.png" alt="Dach's Automotive Logo" class="logo">
        </div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
            </ul>
        </nav>
    </header>

    <!-- MAIN CONTENT - Background Image + Hotspots -->
    <div class="main-content">
        <div class="hotspot" style="top: 70%; left: 20%;" data-service="Engine Diagnostics & Oil Change" data-description="We provide complete engine diagnostics and professional oil change services."></div>
        <div class="hotspot" style="top: 87%; left: 76%;" data-service="Side Mirror Replacement" data-description="Quick and affordable side mirror repair or replacement."></div>
        <div class="hotspot" style="top: 60%; left: 85%;" data-service="Windshield Repair" data-description="Fix windshield cracks and enhance your car with professional tinting."></div>
        <div class="hotspot" style="top: 40%; left: 50%;" data-service="Tire Change & Alignment" data-description="Get new tires and professional alignment for a smooth drive."></div>
        <div class="hotspot" style="top: 20%; left: 30%;" data-service="Suspension & Underbody Repairs" data-description="We check and repair your suspension for a comfortable ride."></div>


        <!-- Hotspot Info Block -->
        <div class="hotspot-info" id="hotspotInfo">
            <h3 id="hotspotTitle"></h3>
            <p id="hotspotDescription"></p>
        </div>
    </div>

    <!-- GOOGLE MAPS LOCATION -->
    <section class="map-container">
        <h2>Our Location</h2>
        <iframe 
            width="100%" 
            height="300" 
            frameborder="0" 
            style="border:0" 
            allowfullscreen 
            loading="lazy"
            src="https://maps.google.com/maps?q=9211+Avenue+L,+Brooklyn,+NY+11236&output=embed">
        </iframe>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2024 Dach's Automotive. All Rights Reserved.</p>
        <p>📍 9211 Avenue L, Brooklyn, NY 11236</p>
        <p>📞 (718) 649-2626 | ✉️ info@dachsautomotive.com</p>
        <div class="social-icons">
            <a href="#">Facebook</a> | 
            <a href="https://www.instagram.com/dachsauto">Instagram</a> 
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
