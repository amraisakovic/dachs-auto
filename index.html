<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dach's Automotive Inc.</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- HEADER (Navbar) -->
    <header id="navbar">
        <div class="logo-container">
            <img src="./dachs-auto/assets/Dachs logo.png" alt="Dach's Automotive Logo" class="logo">
        </div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
            
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- MAIN CONTENT - Background Image + Hotspots -->
    <div class="main-content">
        <div class="hotspot" style="top: 60%; left: 20%;" data-service="Engine Diagnostics & Oil Change" data-description="Complete engine diagnostics and professional oil change services."></div>
        <div class="hotspot" style="top: 35%; left: 50%;" data-service="Windshield Repair & Tinting" data-description="Fix windshield cracks and enhance your car with professional tinting."></div>
        <div class="hotspot" style="top: 85%; left: 75%;" data-service="Side Mirror Replacement" data-description="Quick and affordable side mirror repair or replacement."></div>
        <div class="hotspot" style="top: 50%; left: 85%;" data-service="Tire Change & Alignment" data-description="Get new tires and professional alignment for a smooth drive."></div>
        <div class="hotspot" style="top: 20%; left: 30%;" data-service="Suspension & Underbody Repairs" data-description="We check and repair your suspension for a comfortable ride."></div>
    </div>

    <!-- CONTACT & MAP SECTION -->
    <section class="contact-map-container">
        <div class="contact-info" id="contact">
            <h2>Contact Us</h2>
            <p>📞 (718) 649-2626</p>
            <p>✉️ info@dachsautomotive.com</p>
        </div>
        <div class="map-container">
            <h2>Our Location</h2>
            <iframe 
                width="100%" 
                height="300" 
                frameborder="0" 
                style="border:0" 
                allowfullscreen 
                loading="lazy"
                src="https://maps.google.com/maps?q=9211+Avenue+L,+Brooklyn,+NY+11236&output=embed">
            </iframe>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2024 Dach's Automotive. All Rights Reserved.</p>
        <div class="social-icons">
            <a href="https://www.facebook.com/dachsautomotive">Facebook</a> | 
            <a href="https://www.instagram.com/dachs-automotive-inc/">Instagram</a> 
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
